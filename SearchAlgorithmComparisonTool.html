  <script>
    let numbers = [];
    let sortedNumbers = [];
    const sizeInput = document.getElementById('list-size');
    const targetInput = document.getElementById('target');
    const message = document.getElementById('message');

    function clearResults() {
      for (const name of ['linear', 'binary']) {
        document.getElementById(name + '-status').textContent = 'Ready to search';
        document.getElementById(name + '-checked').textContent = '—';
        document.getElementById(name + '-time').textContent = '—';
      }
    }

    function generate(event) {
      event.preventDefault();
      const size = Number(sizeInput.value);
      if (!Number.isInteger(size) || size < 1 || size > 10000) {
        message.textContent = 'Enter a whole-number list size from 1 to 10,000.';
        sizeInput.focus();
        return;
      }
      const values = new Set();
      while (values.size < size) values.add(Math.floor(Math.random() * 999999) + 1);
      numbers = [...values];
      sortedNumbers = [...numbers].sort((a, b) => a - b);
      const preview = document.getElementById('number-list');
      preview.replaceChildren();
      const fragment = document.createDocumentFragment();
      for (const number of numbers.slice(0, 60)) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = number.toLocaleString('en-US');
        fragment.appendChild(chip);
      }
      preview.appendChild(fragment);
      document.getElementById('list-count').textContent = `${size.toLocaleString('en-US')} ${size === 1 ? 'element' : 'elements'}`;
      targetInput.value = '';
      clearResults();
      message.textContent = 'New list generated. Pick a target or enter your own.';
      message.style.color = '#41634c';
    }

    function pickTarget() {
      if (!numbers.length) {
        message.style.color = '#9a422e';
        message.textContent = 'Generate a list first.';
        return;
      }
      targetInput.value = numbers[Math.floor(Math.random() * numbers.length)];
      message.textContent = 'Target selected from the list.';
      message.style.color = '#41634c';
      targetInput.focus();
    }

    function linearSearch(values, target) {
      let checked = 0;
      for (let i = 0; i < values.length; i++) {
        checked++;
        if (values[i] === target) return { found: true, checked };
      }
      return { found: false, checked };
    }

    function binarySearch(values, target) {
      let low = 0, high = values.length - 1, checked = 0;
      while (low <= high) {
        const middle = Math.floor((low + high) / 2);
        checked++;
        if (values[middle] === target) return { found: true, checked };
        if (values[middle] < target) low = middle + 1;
        else high = middle - 1;
      }
      return { found: false, checked };
    }

    function runAlgorithm(name, algorithm, values, target) {
      const start = performance.now();
      const result = algorithm(values, target);
      const elapsed = performance.now() - start;
      document.getElementById(name + '-status').textContent = result.found ? 'Target found' : 'Not found';
      document.getElementById(name + '-checked').textContent = result.checked.toLocaleString('en-US');
      document.getElementById(name + '-time').textContent = `${elapsed.toFixed(4)} ms`;
    }

    function search(event) {
      event.preventDefault();
      if (!numbers.length) {
        message.style.color = '#9a422e';
        message.textContent = 'Generate a list first.';
        return;
      }
      const target = Number(targetInput.value);
      if (!targetInput.value.trim() || !Number.isInteger(target) || target < 1 || target > 999999) {
        message.style.color = '#9a422e';
        message.textContent = 'Enter a whole-number target from 1 to 999,999.';
        targetInput.focus();
        return;
      }
      runAlgorithm('linear', linearSearch, numbers, target);
      runAlgorithm('binary', binarySearch, sortedNumbers, target);
      message.textContent = 'Both searches complete.';
      message.style.color = '#41634c';
    }

    document.getElementById('setup-form').addEventListener('submit', generate);
    document.getElementById('search-form').addEventListener('submit', search);
    document.getElementById('pick-button').addEventListener('click', pickTarget);
    generate(new Event('submit', { cancelable: true }));
  </script>
 </body>
</html>
